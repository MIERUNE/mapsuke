name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Package published release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/package_plugin.py "$RELEASE_TAG"
      - name: Upload ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
      - name: Upload ZIP to plugins.qgis.org
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          curl -X POST \
            "https://plugins.qgis.org/plugins/api/mapsuke/version/add/" \
            -H "Authorization: Bearer $QGIS_PLUGIN_TOKEN" \
            -F "package=@$(ls dist/*.zip)" \
            --fail
